[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-cerberus"
version = "0.1.0"
description = "Distributed Batch Inference Pipeline — YOLOv8 video inference with swappable compute (EC2, Fargate, Lambda)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "numpy>=1.24",
    "boto3>=1.28",
    "ultralytics>=8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "pytest-mock>=3.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests (fast, no external dependencies)",
    "integration: Integration tests (require real AWS resources)",
    "e2e: End-to-end tests (full pipeline)",
]
addopts = "-v --tb=short"
